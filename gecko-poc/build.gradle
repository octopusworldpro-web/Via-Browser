plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.octopusworldpro.omega.browser.geckopoc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.octopusworldpro.omega.browser.geckopoc'
        // GeckoView requires Android 8.0 / API 26 or newer.
        // Keep this prototype isolated so the main app retains its API 19 floor.
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // This release uses androidx.core 1.16.0 and predates the newer
    // Media3 dependency that requires compileSdk 36/37.
    implementation 'org.mozilla.geckoview:geckoview:140.0.20250630155423'
}
