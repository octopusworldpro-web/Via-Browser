plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.octopusworldpro.omega.browser.geckopoc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.octopusworldpro.omega.browser.geckopoc'
        // GeckoView currently requires Android 8.0 / API 26 or newer.
        // This isolated prototype deliberately does not raise the main app's API 19 floor.
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455'
}
