name: OmegA Android Source Build

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'app/**'
      - 'gecko-poc/**'
      - 'scripts/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-source-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate bundled GeckoView WebExtension POC
        run: node scripts/validate-gecko-extension-poc.js
      - name: Run utility and controller tests
        run: |
          node --test utilities/fbstate/fbstate.test.js
          node --test utilities/device-identity/device-identity.test.js
          node --test utilities/android-integration/feature-controller.test.js
      - name: Build main WebView APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build isolated GeckoView proof-of-concept APK
        run: gradle :gecko-poc:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Verify GeckoView proof-of-concept APK
        run: |
          test -s gecko-poc/build/outputs/apk/debug/gecko-poc-debug.apk
          ls -lh gecko-poc/build/outputs/apk/debug/gecko-poc-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OmegA-Browser-native-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OmegA-GeckoView-POC-debug
          path: gecko-poc/build/outputs/apk/debug/gecko-poc-debug.apk
          if-no-files-found: error
