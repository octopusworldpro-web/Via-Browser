name: OmegA Browser — Lightweight Features Safety Gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/extension-manager.json'
      - 'AUDIT/STEP-03-EXTENSION-RUNTIME.md'
      - 'AUDIT/STEP-10-C3C-FBSTATE-UTILITY.md'
      - 'utilities/fbstate/**'
      - 'README.md'
      - '.github/workflows/omega-step3-extension-guard.yml'

permissions:
  contents: read

jobs:
  lightweight-features-safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate extension and FBState safety defaults
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('config/extension-manager.json').read_text())
          ext = cfg['extensionManager']
          assert ext['enabled'] is False
          assert ext['runtimeAvailable'] is False
          assert ext['chromeExtensionExecution'] is False
          assert ext['webStoreInstallEnabled'] is False
          assert ext['webStoreCompatibility'] is False
          assert ext['runtimeAdapterRequiredForExecution'] is True
          assert ext['engineStrategy'] == 'retain_android_webview'
          assert ext['implementationTarget'] == 'restricted_isolated_content_script_subset'
          assert ext['fullChromeExtensionCompatibility'] is False
          assert ext['geckoViewBundled'] is False
          assert ext['minSdkPreservationTarget'] == 19
          assert set(ext['plannedImportSources']) == {'local_zip', 'local_crx'}
          sec = ext['security']
          for key in ('executeDuringImport', 'autoGrantPermissions', 'exposeCookiesByDefault',
                      'exposePasswordsByDefault', 'exposeHistoryByDefault'):
              assert sec[key] is False, f'Unsafe extension default: {key}'
          for key in ('rejectPathTraversal', 'rejectSymlinks', 'requireArchiveLimits',
                      'requireAtomicUpdates'):
              assert sec[key] is True, f'Missing extension security requirement: {key}'
          assert ext['preserveExistingUserscripts'] is True
          fb = cfg['fbStateUtility']
          assert fb['enabled'] is False
          assert fb['requireExplicitUserAction'] is True
          assert fb['requirePerOperationConsent'] is True
          for key in ('automaticWebViewCookieExtraction', 'backgroundCollection',
                      'networkUpload', 'cloudSync', 'credentialLogging', 'passwordCollection'):
              assert fb[key] is False, f'Unsafe FBState default: {key}'
          assert fb['keepDataInAppPrivateStorage'] is True
          assert fb['clearTemporaryDataOnExit'] is True
          assert set(fb['validateCookieNames']) == {'c_user', 'xs'}
          assert 'web_store' not in ext['plannedImportSources']
          print('PASS: Web Store disabled; local-only FBState safety defaults verified')
          PY
      - name: Run FBState parser and exporter tests
        run: node --test utilities/fbstate/fbstate.test.js
