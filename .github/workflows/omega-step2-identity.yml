name: OmegA Browser — Step 2 Identity Repack

on:
  workflow_dispatch:
  push:
    paths:
      - 'Via+Browser+-+Fast+&+Light_7.4.1_APKPure.apk'
      - '.github/workflows/omega-step2-identity.yml'
      - 'config/app-identity.json'
      - 'branding/omega-launcher-legacy.svg'
      - 'branding/android-res/**'

permissions:
  contents: read

jobs:
  repackage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Via Browser base
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install Apktool
        run: |
          curl -fsSL -o /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.11.1/scripts/linux/apktool
          curl -fsSL -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Decode base APK
        run: |
          BASE_APK="Via+Browser+-+Fast+&+Light_7.4.1_APKPure.apk"
          test -s "$BASE_APK"
          apktool d -f "$BASE_APK" -o work/decoded

      - name: Apply OmegA application identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path("work/decoded")
          manifest = root / "AndroidManifest.xml"
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree = ET.parse(manifest)
          node = tree.getroot()
          old_id = node.attrib.get("package")
          new_id = "com.octopusworldpro.omega.browser"
          node.set("package", new_id)
          android = "{http://schemas.android.com/apk/res/android}"
          node.set(android + "versionName", "7.4.1-omega")
          node.set(android + "versionCode", "2026112401")

          # Force the launcher/application label directly in the manifest;
          # localized resource aliases in the base APK otherwise keep showing "Via".
          application = node.find("application")
          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          application.set(android + "label", "OmegA Browser")

          # Migrate package-scoped manifest authorities and custom permission names.
          for element in node.iter():
              for key, value in list(element.attrib.items()):
                  if isinstance(value, str) and old_id and old_id in value:
                      element.set(key, value.replace(old_id, new_id))

          # Apply the approved OmegA adaptive launcher icon resources.
          import shutil
          branding = Path("branding/android-res")
          (root / "res" / "drawable").mkdir(parents=True, exist_ok=True)
          (root / "res" / "mipmap-anydpi-v26").mkdir(parents=True, exist_ok=True)
          shutil.copy2(branding / "drawable" / "omega_launcher_background.xml",
                       root / "res" / "drawable" / "omega_launcher_background.xml")
          shutil.copy2(branding / "drawable" / "omega_launcher_foreground.xml",
                       root / "res" / "drawable" / "omega_launcher_foreground.xml")
          shutil.copy2(branding / "mipmap-anydpi-v26" / "ic_launcher.xml",
                       root / "res" / "mipmap-anydpi-v26" / "ic_launcher.xml")
          application.set(android + "icon", "@mipmap/ic_launcher")

          tree.write(manifest, encoding="utf-8", xml_declaration=True)

          # Add OmegA About labels in a separate resource file to avoid clobbering Via strings.
          omega_strings = root / "res" / "values" / "omega_brand.xml"
          omega_strings.parent.mkdir(parents=True, exist_ok=True)
          omega_strings.write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <string name="omega_about_title">About OmegA Browser</string>\n'
              '    <string name="omega_customized_by">Customized by NirZon</string>\n'
              '</resources>\n',
              encoding="utf-8"
          )

          # Update the existing app-name string wherever it is defined.
          for strings in (root / "res").glob("values*/strings.xml"):
              try:
                  st = ET.parse(strings)
                  changed = False
                  for item in st.getroot().findall("string"):
                      if item.attrib.get("name") in {"app_name", "app_name_short"}:
                          item.text = "OmegA Browser"
                          changed = True
                  if changed:
                      st.write(strings, encoding="utf-8", xml_declaration=True)
              except ET.ParseError:
                  raise
          print(f"Identity applied: {old_id} -> {new_id}")
          PY

      - name: Inspect existing About, theme and splash implementation
        run: |
          echo "=== Manifest application and theme ==="
          grep -n -E '<application|android:theme|android:name=' work/decoded/AndroidManifest.xml | head -100
          echo "=== About-related resources ==="
          grep -RniE 'about|version|Via Browser|About Via' work/decoded/res/values* work/decoded/res/layout* 2>/dev/null | head -160 || true
          echo "=== Theme resource definitions ==="
          grep -RniE 'name="(AppTheme|.*Theme|.*Primary|.*Accent|.*Background|.*Splash)' work/decoded/res/values* 2>/dev/null | head -160 || true
          echo "=== Splash-related resources ==="
          find work/decoded/res -maxdepth 3 -type f | grep -Ei 'splash|launch|startup' | head -100 || true
          echo "=== Relevant dex class strings ==="
          strings work/decoded/classes*.dex 2>/dev/null | grep -iE 'AboutActivity|AboutFragment|about|SplashActivity' | head -100 || true

      - name: Generate API 19–25 legacy launcher icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p work/legacy-icons
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"
            pixels="${entry##*:}"
            mkdir -p "work/legacy-icons/mipmap-${density}"
            rsvg-convert -w "${pixels}" -h "${pixels}" branding/omega-launcher-legacy.svg \
              -o "work/legacy-icons/mipmap-${density}/ic_launcher.png"
          done
          cp -R work/legacy-icons/mipmap-* work/decoded/res/
          file work/decoded/res/mipmap-*/ic_launcher.png
          test "$(find work/decoded/res -path '*/ic_launcher.png' | wc -l)" -ge 5

      - name: Rebuild unsigned OmegA APK
        run: |
          apktool b work/decoded -o work/OmegA-Browser-unsigned.apk
          test -s work/OmegA-Browser-unsigned.apk

      - name: Align and sign test APK
        run: |
          zipalign -f -p 4 work/OmegA-Browser-unsigned.apk work/OmegA-Browser-aligned.apk
          keytool -genkeypair -v -keystore work/temporary-test-key.jks \
            -storepass android -keypass android -alias omega-test \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=OmegA Browser Test, OU=Build, O=OmegA, C=SG"
          apksigner sign --ks work/temporary-test-key.jks \
            --ks-pass pass:android --key-pass pass:android \
            --out work/OmegA-Browser.apk work/OmegA-Browser-aligned.apk
          apksigner verify --verbose work/OmegA-Browser.apk

      - name: Verify final package identity
        run: |
          aapt dump badging work/OmegA-Browser.apk | tee work/badging.txt
          grep -F "package: name='com.octopusworldpro.omega.browser'" work/badging.txt
          grep -F "application-label:'OmegA Browser'" work/badging.txt
          grep -F "versionName='7.4.1-omega'" work/badging.txt
          grep -F "sdkVersion:'19'" work/badging.txt
          grep -F "application-icon-160:" work/badging.txt
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            unzip -l work/OmegA-Browser.apk | grep -F "res/mipmap-${density}/ic_launcher.png"
          done
          unzip -l work/OmegA-Browser.apk | grep -F "res/mipmap-anydpi-v26/ic_launcher.xml"
          unzip -l work/OmegA-Browser.apk | grep -F "res/drawable/omega_launcher_foreground.xml"
          apksigner verify --verbose work/OmegA-Browser.apk

      - name: Upload test APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: OmegA-Browser-step3-branding-test-build
          path: |
            work/OmegA-Browser.apk
            work/badging.txt
          if-no-files-found: error
          retention-days: 7
