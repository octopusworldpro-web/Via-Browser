name: OmegA Browser — Step 4 Core Preservation Audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'Via+Browser+-+Fast+&+Light_7.4.1_APKPure.apk'
      - '.github/workflows/omega-step4-core-audit.yml'
      - 'AUDIT/STEP-04-BROWSER-CORE-COMPATIBILITY.md'
      - 'branding/android-res/values/colors.xml'
      - 'branding/android-res/values/styles.xml'

permissions:
  contents: read

jobs:
  core-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout audit files
        uses: actions/checkout@v4

      - name: Download previously verified OmegA APK
        uses: actions/download-artifact@v4
        with:
          name: OmegA-Browser-step4-ui-branding-test-build
          path: work/input
          repository: octopusworldpro-web/Via-Browser
          run-id: 45331285994
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install APK inspection tools
        run: |
          sdkmanager "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          curl -fsSL -o /usr/local/bin/apktool https://raw.githubusercontent.com/iBotPeaches/Apktool/v2.11.1/scripts/linux/apktool
          curl -fsSL -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Verify downloaded OmegA APK integrity
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          apk = Path('work/input/OmegA-Browser.apk')
          assert apk.is_file() and apk.stat().st_size > 1_000_000, 'Verified OmegA APK artifact is missing or unexpectedly small'
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          with zipfile.ZipFile(apk) as z:
              bad = z.testzip()
              assert bad is None, f'Corrupt archive entry: {bad}'
              names = set(z.namelist())
              assert 'classes.dex' in names
              assert 'AndroidManifest.xml' in names
          print(f'PASS: OmegA APK archive valid; SHA-256 {digest}')
          PY

      - name: Decode OmegA APK and resources
        run: apktool d -f work/input/OmegA-Browser.apk -o work/base

      - name: Check browser-core preservation markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("work/base")
          smali_files = list(root.rglob("*.smali"))
          assert smali_files, "Apktool produced no decoded smali files"
          parts = []
          for p in smali_files:
              try:
                  parts.append(p.read_text(errors="ignore"))
              except OSError:
                  pass
          assets = root / "assets"
          if assets.exists():
              for p in assets.rglob("*"):
                  if p.is_file():
                      try:
                          parts.append(p.read_text(errors="ignore"))
                      except (OSError, UnicodeError):
                          pass
          haystack = "\\n".join(parts).lower()
          checks = {
              "WebView browser stack": ["webview", "webviewclient", "webchromeclient"],
              "Cookie/session handling": ["cookiemanager"],
              "Download handling": ["downloadmanager"],
              "History/bookmark support": ["webhistoryitem", "bookmark"],
              "Incognito mode marker": ["incognito"],
              "Reader mode assets": ["reader"],
              "Userscript API preservation": ["gm_getvalue", "gm_setvalue", "gm_xmlhttprequest"],
          }
          failed = []
          for label, needles in checks.items():
              missing = [needle for needle in needles if needle not in haystack]
              status = "PASS" if not missing else "FAIL"
              print(f"{status}: {label}" + (f" (missing: {', '.join(missing)})" if missing else ""))
              if missing:
                  failed.append(label)
          assert not failed, "Core preservation markers missing: " + ", ".join(failed)
          print("NOTE: marker presence is static evidence only; it does not prove runtime behavior.")
          PY

      - name: Verify OmegA UI token resources remain available
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('branding/android-res/values')
          colors = ET.parse(root / 'colors.xml').getroot()
          styles = ET.parse(root / 'styles.xml').getroot()
          values = {node.attrib.get('name'): (node.text or '').strip() for node in colors.findall('color')}
          expected = {'omega_brand_violet': '#A855F7', 'omega_brand_magenta': '#D946EF', 'omega_deep_violet': '#100B2B', 'omega_night': '#090817'}
          for key, value in expected.items():
              assert values.get(key, '').lower() == value.lower(), f'Missing or changed brand token: {key}'
          assert styles.findall('style'), 'No OmegA style resources found'
          print('PASS: OmegA palette and lightweight Android style resources are present')
          PY

      - name: Verify Android compatibility floor and original app namespace
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          apk = "work/input/OmegA-Browser.apk"
          output = subprocess.check_output(["aapt", "dump", "badging", apk], text=True)
          package = re.search(r"^package: name='([^']+)'", output, re.MULTILINE)
          minimum = re.search(r"^sdkVersion:'([^']+)'", output, re.MULTILINE)
          assert package, "aapt could not read package name from compiled APK manifest"
          assert minimum, "aapt could not read minSdkVersion from compiled APK manifest"
          assert package.group(1) == "com.octopusworldpro.omega.browser", f"Unexpected OmegA package: {package.group(1)}"
          assert minimum.group(1) == "19", f"Expected minSdk 19, got {minimum.group(1)}"
          print(f"PASS: OmegA package {package.group(1)}; minSdkVersion {minimum.group(1)}")
          PY

      - name: Upload static audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OmegA-Browser-step4-core-audit
          path: |
            work/base/AndroidManifest.xml
            AUDIT/STEP-04-BROWSER-CORE-COMPATIBILITY.md
          if-no-files-found: warn
          retention-days: 7
